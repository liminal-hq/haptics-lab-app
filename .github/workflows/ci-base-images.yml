name: CI Base Images

on:
  push:
    branches:
      - main
      - chore/integrate-jules-haptics
    paths:
      - 'docker/ci/**'
      - '.github/workflows/ci-base-images.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  DESKTOP_IMAGE_NAME: haptics-lab-ci-desktop
  ANDROID_IMAGE_NAME: haptics-lab-ci-android

jobs:
  build-desktop-image:
    runs-on: ubuntu-latest
    outputs:
      desktop_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve toolchain versions
        id: versions
        run: |
          pnpm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "pnpm_version=$pnpm_version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract desktop image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE_NAMESPACE }}/${{ env.DESKTOP_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push desktop image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/desktop.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            PNPM_VERSION=${{ steps.versions.outputs.pnpm_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-android-image:
    runs-on: ubuntu-latest
    needs: build-desktop-image
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Android image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE_NAMESPACE }}/${{ env.ANDROID_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Android image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/android.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            DESKTOP_IMAGE=${{ env.GHCR_IMAGE_NAMESPACE }}/${{ env.DESKTOP_IMAGE_NAME }}@${{ needs.build-desktop-image.outputs.desktop_digest }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write build summary
        run: |
          echo "## CI base images published" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Desktop: \`${{ env.GHCR_IMAGE_NAMESPACE }}/${{ env.DESKTOP_IMAGE_NAME }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Android: \`${{ env.GHCR_IMAGE_NAMESPACE }}/${{ env.ANDROID_IMAGE_NAME }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Desktop digest: \`${{ needs.build-desktop-image.outputs.desktop_digest }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Android digest: \`${{ steps.build.outputs.digest }}\`" >> "${GITHUB_STEP_SUMMARY}"
