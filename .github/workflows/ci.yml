name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liminal-hq/tauri-ci-desktop:20261009-2d6e4fc@sha256:f35ef8c593216e0135ee3fccd3ae16a7c90d428fd92992db01a0bcff13f1c3ea
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Rust Fmt
        run: bun run rust:fmt

      - name: Rust Clippy
        run: bun run rust:clippy

      - name: Rust Test
        run: bun run rust:test
